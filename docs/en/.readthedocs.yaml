version: 2

sphinx:
  # Path to your Sphinx configuration file.
  configuration: docs/en/conf.py

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    pre_build:
      # Generate on-the-fly Sphinx configuration from Jupyter Book's _config.yml
      - "jupyter-book config sphinx docs/en"
    build:
      html:
        - "jupyter-book build docs/en"
        - "cp -r docs/en/_build/* $READTHEDOCS_OUTPUT"


python:
  install:
  - requirements: docs/requirements-doc.txt
  # - method: pip
  #   path: ".[docs]"
