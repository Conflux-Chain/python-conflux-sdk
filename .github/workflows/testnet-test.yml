# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  pull_request:
    branches: [ "dev", "v1"]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
  
    - name: Install dependencies
      run: |
        pip install ".[tester]"
    - name: Run test
      run: |
        export TESTNET_URL=${{secrets.TESTNET_URL}} &&
        export USE_TESTNET=1 &&
        export ENS_ACCOUNT_NAME=${{secrets.ENS_ACCOUNT_NAME}} &&
        export ENS_ACCOUNT_SECRET=${{secrets.ENS_ACCOUNT_SECRET}} &&
        export TEST_FINALIZATION=1 &&
        pytest tests -vv -n 3 --dist loadgroup
